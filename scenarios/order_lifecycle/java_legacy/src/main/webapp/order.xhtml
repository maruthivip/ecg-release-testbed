<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core">
<h:head><title>Order submission</title></h:head>
<h:body>
  <h:form id="orderForm">
    <h:inputText id="orderId" value="#{orderView.orderId}" required="true" />
    <h:inputText id="amount" value="#{orderView.amount}">
      <f:validateLongRange minimum="1" maximum="1000000" />
    </h:inputText>
    <h:commandButton id="submit" value="Submit" action="#{orderView.submit}">
      <f:ajax execute="@form" render="outcome" />
    </h:commandButton>
    <h:outputText id="outcome" value="#{orderView.result}" />
  </h:form>
</h:body>
</html>
